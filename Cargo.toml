[package]
name = "sysview"
version = "0.1.1"
edition = "2024"
description = "Portable one-shot system stats viewer for Windows, Linux and macOS"
license = "MIT"

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
