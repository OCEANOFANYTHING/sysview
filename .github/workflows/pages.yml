name: pages

# Build and publish the project website (the static site in site/) to
# GitHub Pages. Enable it once in the repo:
#   Settings -> Pages -> Source: "GitHub Actions"
# After that every push to main (or a manual "Run workflow") publishes to
# https://oceanofanything.github.io/sysview/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment