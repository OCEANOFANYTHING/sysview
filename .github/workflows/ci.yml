name: ci

# The one place the gate lives, in three commands over three operating systems:
#   cargo fmt -- --check
#   cargo test --locked
#   cargo clippy --all-targets -- -D warnings
# It runs on every push to main (and on pull requests), so a broken commit is
# caught before it is tagged, and release.yml calls it (workflow_call) so that
# publishing a release is gated on exactly this file rather than a copy of it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
