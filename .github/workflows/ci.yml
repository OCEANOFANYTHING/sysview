name: ci

# The same three commands release.yml gates publishing on, run on every push to
# main (and on pull requests) so a broken commit is caught before a tag:
#   cargo fmt -- --check
#   cargo test --locked
#   cargo clippy --all-targets -- -D warnings
# Tag pushes are covered by release.yml, so a release does not run this twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
