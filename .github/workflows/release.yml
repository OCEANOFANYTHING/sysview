name: release-binaries

# Publish precompiled binaries for Windows, Linux and macOS to a GitHub
# Release whenever a tag like v0.1.0 is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The Linux artifact is a fully static musl build: one binary that runs on
# every distro (Debian, Ubuntu, RHEL, Alpine, headless servers included) with
# no runtime dependencies. macOS ships a universal binary (Intel + Apple
# Silicon). No Docker, no extra tooling is required of users — the archive on
# the Release page is the whole tool.
on:
  push:
    tags:
      - "v*"
  # Manual runs build the artifacts (and upload them) without publishing a
  # release; the publish job only runs for tag pushes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The artifacts are only published when the full suite is green on all three
  # operating systems.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # The bundled HTTPS client (rustls with the compact ring provider)
      # compiles a little C/asm, so the musl target needs a musl C compiler
      # (cc-rs auto-selects musl-gcc).
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/sysview sysview-linux-x86_64-musl
      - run: file sysview-linux-x86_64-musl
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: sysview-linux-x86_64-musl

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: copy target\release\sysview.exe sysview-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: sysview-windows-x86_64.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: lipo -create -output sysview-mac-universal target/aarch64-apple-darwin/release/sysview target/x86_64-apple-darwin/release/sysview
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: sysview-mac-universal

  release:
    needs: [build-linux, build-windows, build-macos]
    # Only publish a real release for tag pushes; manual runs just build
    # artifacts for testing.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: |
          mv artifacts/linux/sysview-linux-x86_64-musl .
          mv artifacts/windows/sysview-windows-x86_64.exe .
          mv artifacts/macos/sysview-mac-universal .
          sha256sum sysview-linux-x86_64-musl sysview-windows-x86_64.exe sysview-mac-universal > SHA256SUMS
          cat SHA256SUMS
      - name: Compose release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="$TAG" '
            /^## \[/ { if (index($0, "## [" tag "]")) on = 1; else if (on) exit }
            on { print }
          ' CHANGELOG.md > notes.md
          # Refuse to publish a release without its changelog section: an empty
          # extraction used to leave the body blank and let GitHub fall back to
          # the auto-generated PR list (renovate/dependabot noise).
          if ! grep -q "^## \[${TAG}\]" notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG} — add one before tagging"
            exit 1
          fi
          printf '\n---\nFull changelog: https://github.com/OCEANOFANYTHING/sysview/blob/main/CHANGELOG.md\n' >> notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            sysview-linux-x86_64-musl
            sysview-windows-x86_64.exe
            sysview-mac-universal
            SHA256SUMS
          body_path: notes.md